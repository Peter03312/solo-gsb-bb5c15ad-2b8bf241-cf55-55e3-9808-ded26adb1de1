services:
  tracebench:
    build: .
    image: water-lab-tracebench:latest
    container_name: water-lab-tracebench
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # 容器内监听端口（一般无需修改；对外端口改 .env 中的 PORT）
      PORT: 3000
      DB_PATH: /app/data/lab.db
      # 首次启动是否写入演示数据：true / false
      SEED_DEMO: "${SEED_DEMO:-true}"
    volumes:
      # 持久化 SQLite 数据库，容器重建不丢数据
      - tracebench-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  tracebench-data:
